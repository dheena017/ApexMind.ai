<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="logo-apex-1" x1="12" y1="52" x2="32" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="logo-apex-2" x1="52" y1="52" x2="32" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="logo-text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark Container -->
  <g transform="translate(4, 2)">
    <rect width="60" height="60" rx="15" fill="#0A0F1D" />
    <rect width="60" height="60" rx="15" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1.2" />

    <!-- Left Ascent Wing -->
    <path d="M30 11 L14 45 C13.5 46.1 14.5 47.3 15.7 47 L26 43 L30 22 Z" fill="url(#logo-apex-1)" />

    <!-- Right Ascent Wing -->
    <path d="M30 11 L46 45 C46.5 46.1 45.5 47.3 44.3 47 L34 43 L30 22 Z" fill="url(#logo-apex-2)" />

    <!-- Core Facet -->
    <path d="M30 13 L34 42 L30 39 L26 42 Z" fill="#38BDF8" fill-opacity="0.35" />

    <!-- Neural Glow Nodes & Synapses -->
    <g filter="url(#logo-glow)">
      <circle cx="30" cy="12" r="3.2" fill="#FFFFFF" />
      <circle cx="30" cy="12" r="1.8" fill="#38BDF8" />
      <circle cx="20" cy="35" r="1.6" fill="#93C5FD" />
      <circle cx="40" cy="35" r="1.6" fill="#C4B5FD" />
      <circle cx="30" cy="30" r="2.2" fill="#E0F2FE" />
    </g>

    <!-- Circuit connections -->
    <line x1="20" y1="35" x2="30" y2="30" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0.5 2" />
    <line x1="40" y1="35" x2="30" y2="30" stroke="#C4B5FD" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0.5 2" />
    <line x1="30" y1="30" x2="30" y2="15" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Typography / Brand Name -->
  <g transform="translate(80, 42)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5" fill="url(#logo-text-grad)">ApexMind</text>
  </g>

  <!-- AI Badge Pill -->
  <g transform="translate(232, 22)">
    <rect width="38" height="22" rx="6" fill="#1E293B" fill-opacity="0.8" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.4" />
    <text x="19" y="15" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">AI</text>
  </g>
</svg>

