<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="apex-grad-1" x1="12" y1="54" x2="32" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="apex-grad-2" x1="52" y1="54" x2="32" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="apex-core" x1="32" y1="48" x2="32" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#0D1117" />
  <rect width="64" height="64" rx="16" stroke="rgba(96, 165, 250, 0.25)" stroke-width="1.5" />

  <!-- Left Apex Wing / Ascent Facet -->
  <path d="M32 12 L15 48 C14.5 49.2 15.6 50.5 16.9 50.1 L28 46 L32 24 Z" fill="url(#apex-grad-1)" />

  <!-- Right Apex Wing / Ascent Facet -->
  <path d="M32 12 L49 48 C49.5 49.2 48.4 50.5 47.1 50.1 L36 46 L32 24 Z" fill="url(#apex-grad-2)" />

  <!-- Neural Core Spine & Brain Chevron Peak -->
  <path d="M32 14 L36 45 L32 42 L28 45 Z" fill="url(#apex-core)" />

  <!-- Neural Synapse Connections & Glow Nodes -->
  <g filter="url(#neon-glow)">
    <circle cx="32" cy="14" r="3" fill="#FFFFFF" />
    <circle cx="32" cy="14" r="1.5" fill="#38BDF8" />

    <!-- Pulse nodes on the wings -->
    <circle cx="21" cy="38" r="1.8" fill="#93C5FD" />
    <circle cx="43" cy="38" r="1.8" fill="#C4B5FD" />
    <circle cx="32" cy="32" r="2" fill="#E0F2FE" />
  </g>

  <!-- Inner Synaptic Circuit Lines -->
  <line x1="21" y1="38" x2="32" y2="32" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0.5 2" />
  <line x1="43" y1="38" x2="32" y2="32" stroke="#C4B5FD" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0.5 2" />
  <line x1="32" y1="32" x2="32" y2="16" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />
</svg>

